<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Medical Outreach PJ — Our Journey</title>
<meta name="description" content="A visual archive of Medical Outreach PJ's outreach programmes.">
<style>
:root{
  --ink:#0f1410; --paper:#faf7f1; --panel:#161b17; --gold:#c6a15b; --gold-soft:#e4cfa0;
  --sage:#4f6a56; --line:rgba(198,161,91,.25); --muted:#9aa39c; --sold-red:#8c2f2f;
}
*{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--ink); font-family:'Helvetica Neue',Arial,sans-serif}
h1,h2,.badge{font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif}
img,video{max-width:100%; display:block}
button{font-family:inherit}

header.hero{background:var(--panel); color:var(--paper); padding:52px 24px 34px; text-align:center; border-bottom:4px solid var(--gold)}
header.hero img.logo{width:68px; height:68px; border-radius:50%; margin-bottom:14px; box-shadow:0 0 0 4px rgba(198,161,91,.25)}
header.hero h1{font-size:clamp(1.8rem,6vw,2.4rem); margin:0 0 6px}
header.hero p.sub{color:var(--gold-soft); font-size:.95rem; margin:0 0 20px}
.stats{display:flex; gap:clamp(14px,5vw,30px); justify-content:center; flex-wrap:wrap}
.stats div{text-align:center}
.stats .num{font-size:1.35rem; font-weight:700; color:var(--gold); display:block; font-family:'Iowan Old Style',Georgia,serif}
.stats .lbl{font-size:.65rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}

main{max-width:1100px; margin:0 auto; padding:34px 18px 100px}

/* ---------- HOME: big button grid ---------- */
#homeView h2.section-title{font-size:1.1rem; color:#666; font-weight:600; margin:0 0 18px; text-align:center; text-transform:uppercase; letter-spacing:.06em}
.big-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:18px}
.big-btn{
  position:relative; border:none; padding:0; border-radius:18px; overflow:hidden; cursor:pointer;
  aspect-ratio:4/3; background:#e9e4d6; box-shadow:0 4px 14px rgba(0,0,0,.10);
  transition:transform .25s ease, box-shadow .25s ease; border:3px solid transparent;
}
.big-btn:hover{transform:translateY(-4px) scale(1.015); box-shadow:0 10px 26px rgba(0,0,0,.18); border-color:var(--accent)}
.big-btn img,.big-btn video{width:100%; height:100%; object-fit:cover}
.big-btn .overlay{
  position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,.78) 100%);
}
.big-btn .bb-label{
  position:absolute; left:0; right:0; bottom:0; padding:16px 18px 14px; text-align:left; color:#fff;
}
.big-btn .bb-dot{width:10px; height:10px; border-radius:50%; background:var(--accent); display:inline-block; margin-bottom:6px; box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.big-btn .bb-name{display:block; font-family:'Iowan Old Style',Georgia,serif; font-size:1.3rem; font-weight:700; line-height:1.15}
.big-btn .bb-count{display:block; font-size:.72rem; color:rgba(255,255,255,.8); margin-top:2px}

/* ---------- CATEGORY view ---------- */
#categoryView{display:none}
#categoryView.active{display:block}
.cat-header{display:flex; align-items:center; gap:14px; margin-bottom:22px; flex-wrap:wrap}
.back-btn{
  border:none; background:#fff; border:1px solid var(--line); border-radius:10px; padding:9px 16px;
  font-size:.82rem; font-weight:600; cursor:pointer; color:#444; display:flex; align-items:center; gap:6px;
}
.back-btn:hover{background:#f5f0e4}
.cat-header h2{margin:0; font-size:1.6rem}
.cat-range{color:var(--muted); font-size:.82rem; margin-left:auto}

.nav-strip-wrap{margin-bottom:30px; position:relative}
.nav-strip-label{font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:10px}
.nav-strip{display:flex; gap:12px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding:2px 4px 8px 2px; scrollbar-width:none; scroll-snap-type:x proximity}
.nav-strip::-webkit-scrollbar{display:none}
.nav-strip .nav-btn{scroll-snap-align:start}
.nav-strip-wrap::after{
  content:''; position:absolute; right:0; bottom:4px; width:52px; height:118px;
  background:linear-gradient(270deg, var(--paper) 25%, transparent); pointer-events:none;
}
@media (max-width:560px){
  .nav-strip-wrap::after{height:96px}
}
.nav-btn{
  position:relative; flex:0 0 auto; width:118px; aspect-ratio:1/1; border-radius:14px; overflow:hidden;
  border:3px solid transparent; cursor:pointer; padding:0; background:#e9e4d6;
}
.nav-btn.current{border-color:var(--accent-self, var(--gold))}
.nav-btn img,.nav-btn video{width:100%; height:100%; object-fit:cover}
.nav-btn .overlay{position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(0,0,0,.75) 100%)}
.nav-btn .nb-label{position:absolute; left:0; right:0; bottom:0; padding:8px 8px 7px; color:#fff; font-size:.68rem; font-weight:700; text-align:left; line-height:1.15}

.spine{border-left:2px solid var(--line); padding-left:22px; display:flex; flex-direction:column; gap:22px; margin-left:6px}
article.moment{
  position:relative; background:#fff; border-radius:14px; border:1px solid #eee2cc; border-left:6px solid var(--accent);
  padding:16px 16px 14px; box-shadow:0 1px 3px rgba(0,0,0,.05);
  opacity:0; transform:translateY(16px); animation:cardin .5s ease forwards;
}
article.moment::before{
  content:''; position:absolute; left:-29px; top:20px; width:11px; height:11px; border-radius:50%;
  background:var(--accent); border:3px solid var(--paper); box-shadow:0 0 0 2px var(--accent);
}
@keyframes cardin{to{opacity:1; transform:translateY(0)}}

.moment-head{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:12px}
.date{font-weight:600; font-size:.88rem}
.date-unknown{font-weight:600; font-size:.82rem; color:var(--sold-red); font-style:italic}
.loc{color:#555; font-size:.83rem}
.loc::before{content:"— "; color:#bbb}
.count{margin-left:auto; font-size:.72rem; color:var(--muted)}

.carousel-wrap{position:relative; overflow:hidden; border-radius:10px}
.carousel-wrap::before,.carousel-wrap::after{content:''; position:absolute; top:0; bottom:0; width:26px; z-index:2; pointer-events:none}
.carousel-wrap::before{left:0; background:linear-gradient(90deg,#fff,transparent)}
.carousel-wrap::after{right:0; background:linear-gradient(270deg,#fff,transparent)}
.carousel-track{display:flex; gap:8px; will-change:transform}
.carousel-track.auto{animation:scrollpast linear infinite; animation-duration:var(--dur,30s)}
.carousel-wrap:hover .carousel-track.auto,.carousel-wrap.touching .carousel-track.auto{animation-play-state:paused}
@keyframes scrollpast{from{transform:translateX(0)} to{transform:translateX(-50%)}}
.carousel-wrap.manual{overflow-x:auto; -webkit-overflow-scrolling:touch; scroll-snap-type:x proximity}
.carousel-wrap.manual .carousel-track{animation:none !important}
.carousel-wrap.manual .tile{scroll-snap-align:start}

.tile{flex:0 0 auto; width:150px; height:150px; border-radius:9px; overflow:hidden; position:relative; background:#f0ede4; cursor:pointer}
.tile img,.tile video{width:100%; height:100%; object-fit:cover}
.tile.pair{width:150px; display:flex; flex-direction:column; gap:2px}
.tile.pair img,.tile.pair video{height:74px; object-fit:cover}
.tile.video .play-badge{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:1.3rem; background:rgba(0,0,0,.28)}
.undated-flag{display:inline-block; font-size:.68rem; background:#fbeaea; color:var(--sold-red); padding:2px 8px; border-radius:10px; margin-left:6px}

footer{text-align:center; padding:24px; font-size:.72rem; color:var(--muted); background:var(--panel)}

#lightbox{position:fixed; inset:0; background:rgba(10,12,10,.94); z-index:100; display:none; align-items:center; justify-content:center; flex-direction:column; padding:24px}
#lightbox.open{display:flex}
#lightbox img,#lightbox video{max-height:78vh; max-width:92vw; border-radius:8px; box-shadow:0 10px 40px rgba(0,0,0,.5)}
#lightbox .lb-meta{color:var(--gold-soft); font-size:.8rem; margin-top:14px; text-align:center}
#lightbox .lb-close{position:absolute; top:18px; right:22px; color:#fff; font-size:1.8rem; background:none; border:none; cursor:pointer}
#lightbox .lb-nav{position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.08); border:none; color:#fff; font-size:1.6rem; padding:10px 14px; cursor:pointer; border-radius:8px}
#lightbox .lb-prev{left:14px} #lightbox .lb-next{right:14px}

@media (max-width:820px){
  .big-grid{grid-template-columns:repeat(2, 1fr)}
}
@media (max-width:560px){
  .big-grid{grid-template-columns:1fr; gap:14px}
  .big-btn{aspect-ratio:16/10}
  .cat-range{margin-left:0; width:100%}
  .spine{padding-left:16px; margin-left:2px}
  article.moment{padding:13px 12px 12px}
  article.moment::before{left:-23px; width:9px; height:9px}
  .tile{width:112px; height:112px}
  .tile.pair{width:112px}
  .tile.pair img,.tile.pair video{height:55px}
  .nav-btn{width:96px}
  main{padding:24px 12px 80px}
}
</style>
</head>
<body>
<header class="hero">
  <img class="logo" src="logo.png" alt="Medical Outreach PJ logo">
  <h1>Our Journey</h1>
  <p class="sub">Medical Outreach PJ — a visual archive by programme, 2013–2026</p>
  <div class="stats">
    <div><span class="num">37</span><span class="lbl">Moments</span></div>

    <div><span class="num">9</span><span class="lbl">Programmes</span></div>
  </div>
</header>

      <h2 id="catTitle"></h2>
      <span class="cat-range" id="catRange"></span>
    </div>

      <div class="nav-strip" id="navStrip"></div>
    </div>
    <div class="spine" id="catSpine"></div>
  </section>
</main>

<div id="lightbox">
  <button class="lb-close" id="lbClose">&times;</button>
  <button class="lb-nav lb-prev" id="lbPrev">&#8249;</button>
  <button class="lb-nav lb-next" id="lbNext">&#8250;</button>
  <div id="lbMediaWrap"></div>
  <div class="lb-meta" id="lbMeta"></div>
</div>

": "m001", "heading": "Art Fundraiser", "location": null, "folder": "Art Fundraiser/19 oct 2014", "images": [{"file": "01_20141019.jpeg", "order": 1, "caption": "", "collageGroup": null, "orderNote": "", "type": "image"}, {"file": "02_20141019.jpeg", "order": 2, "caption": "", "collageGroup": null, "orderNote": "", "type": "image"}, {"file": "03_20141019.jpeg", "order": 3, "caption": "", "collageGroup": null, "orderNote": "", "type": "image"}, {"file": "04_20141019.jpeg", "order": 4, "caption": "", "collageGroup": null, "orderNote": "", "type": "image"}, {"file": "05_20141019.jpeg", "order": 5, "caption": "", "collageGroup": null, "orderNote": "", "type": "image"}, {"file": "06_20141019.jpeg", "order": 6, "caption": "", "collageGroup": null, "orderNote": "", "type": "image"}, {"file": "07_20141019.jpeg", "order": 7, "caption": "", "collageGroup": null, "orderNote": "", "type": "image"}, {"file": "08_20141019.jpeg", "order": 8, "caption": "", "collageGroup": null, "orderNote": "", "type": "image"}, {"file": "09_20141019.jpeg", "order": 9, "caption": "", "collageGroup": null, "orderNote": "", "type": "image"}, {"file": "10_20141019.jpeg", "order": 10, "caption": "", "collageGroup": null, "orderNote": "", "type": "image"}], "date": {"year": 2014, "month": 10, "day": 19, "precision": "day"}, "dateLabel": "19 Oct 2014", "sortKey": "2014-10-19"}]}, "thumbs": {"Orang Asli": {"folder": "Orang Asli/Bentong/20 jul 2014", "file": "01_20140720.jpeg", "type": "image"}, "UNHCR": {"folder": "UNHCR/1 dec 2017", "file": "01_20171201.jpeg", "type": "image"}, "Partner NGO": {"folder": "Partner NGO/B40/22 sep 2013", "file": "01_20130922.jpeg", "type": "image"}, "Homeless": {"folder": "Homeless/15 dec 2014", "file": "01_20141215.jpeg", "type": "image"}, "Supplies": {"folder": "Supplies/12 sep 2013", "file": "01_20130912.jpeg", "type": "image"}, "Outstation": {"folder": "Outstation/Padawan Kuching/8 march 2015", "file": "01_20150308.jpeg", "type": "image"}, "International": {"folder": "International/16 sep 2018 - sapa vietnam", "file": "01_20180916.jpeg", "type": "image"}, "Art Fundraiser": {"folder": "Art Fundraiser/19 oct 2014", "file": "01_20141019.jpeg", "type": "image"}}, "meta": {"totalPhotos": 240, "totalMoments": 36, "yearMin": 2013, "yearMax": 2026}}</script>
<script>
(function(){
  const DATA = JSON.parse(document.getElementById('timeline-data').textContent);
  const COLORS = DATA.headingColors;
  const isTouch = !window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function encPath(p){ return p.split('/').map(encodeURIComponent).join('/'); }
  function mediaSrc(folder, file){ return 'Video/' + encPath(folder) + '/' + encodeURIComponent(file); }
  function thumbTag(h){
    const t = DATA.thumbs[h];
    if (!t) return '';
    const src = mediaSrc(t.folder, t.file);
    return t.type === 'video' ? `<video src="${src}" muted preload="metadata"></video>` : `<img src="${src}" loading="lazy" alt="${esc(h)}">`;
  }

  // ---- home grid ----
  const bigGrid = document.getElementById('bigGrid');
  bigGrid.innerHTML = DATA.tabOrder.map(h => {
    const list = DATA.byHeading[h] || [];
    return `<button class="big-btn" data-heading="${esc(h)}" style="--accent:${COLORS[h]}">
      ${thumbTag(h)}
      <div class="overlay"></div>
      <div class="bb-label">
        <span class="bb-dot"></span>
        <span class="bb-name">${esc(DATA.tabLabels[h])}</span>
        <span class="bb-count">${list.length} moment${list.length!==1?'s':''}</span>
      </div>
    </button>`;
  }).join('');
  bigGrid.addEventListener('click', (e) => {
    const btn = e.target.closest('.big-btn');
    if (btn) openCategory(btn.dataset.heading);
  });

  // ---- category nav strip (big buttons) ----
  const navStrip = document.getElementById('navStrip');
  function renderNavStrip(current){
    navStrip.innerHTML = DATA.tabOrder.map(h => {
      const list = DATA.byHeading[h] || [];
      return `<button class="nav-btn${h===current?' current':''}" data-heading="${esc(h)}" style="--accent-self:${COLORS[h]}">
        ${thumbTag(h)}
        <div class="overlay"></div>
        <div class="nb-label">${esc(DATA.tabLabels[h])}</div>
      </button>`;
    }).join('');
  }
  navStrip.addEventListener('click', (e) => {
    const btn = e.target.closest('.nav-btn');
    if (btn) openCategory(btn.dataset.heading);
  });
  document.getElementById('backBtn').addEventListener('click', () => {
    document.getElementById('categoryView').classList.remove('active');
    document.getElementById('homeView').style.display = '';
    window.scrollTo({top:0, behavior:'smooth'});
  });

  // ---- moment rendering (carousel + lightbox), same as before ----
  function buildTiles(m){
    const imgs = m.images.slice().sort((a,b)=>a.order-b.order);
    const tiles = []; const seen = new Set();
    imgs.forEach(im => {
      if (seen.has(im.file)) return;
      if (im.collageGroup){
        const partner = imgs.find(x => x.collageGroup === im.collageGroup && x.file !== im.file);
        if (partner && !seen.has(partner.file)){
          tiles.push({type:'pair', items:[im, partner]}); seen.add(im.file); seen.add(partner.file); return;
        }
      }
      tiles.push({type:'single', items:[im]}); seen.add(im.file);
    });
    return tiles;
  }
  let allGroups = [];
  function tileHTML(tile, m, flat){
    const idx = flat.length;
    if (tile.type === 'pair'){
      const inner = tile.items.map(im => mediaTag(im, m)).join('');
      flat.push({m, images:tile.items});
      return `<div class="tile pair" data-idx="${idx}">${inner}</div>`;
    }
    const im = tile.items[0];
    flat.push({m, images:[im]});
    if (im.type === 'video'){
      return `<div class="tile video" data-idx="${idx}"><video src="${mediaSrc(im.folder || m.folder, im.file)}" muted preload="metadata"></video><span class="play-badge">&#9658;</span></div>`;
    }
    return `<div class="tile" data-idx="${idx}"><img src="${mediaSrc(im.folder || m.folder, im.file)}" loading="lazy" alt="${esc(m.heading)}"></div>`;
  }
  function mediaTag(im, m){
    if (im.type === 'video') return `<video src="${mediaSrc(im.folder || m.folder, im.file)}" muted preload="metadata"></video>`;
    return `<img src="${mediaSrc(im.folder || m.folder, im.file)}" loading="lazy" alt="${esc(m.heading)}">`;
  }
  function momentHTML(m, color, i){
    const tiles = buildTiles(m);
    const flat = [];
    const tilesHTML = tiles.map(t => tileHTML(t, m, flat)).join('');
    const groupIndex = allGroups.length;
    allGroups.push({folder:m.folder, flat});
    const many = flat.length >= 4;
    const trackHTML = many ? tilesHTML + tilesHTML : tilesHTML;
    const dur = Math.max(14, flat.length * 3.2).toFixed(1) + 's';
    const wrapClass = many && !isTouch ? 'carousel-wrap' : 'carousel-wrap manual';
    const trackClass = many && !isTouch ? 'carousel-track auto' : 'carousel-track';
    const dateHTML = m.date
      ? `<span class="date">${esc(m.dateLabel)}</span>`
      : `<span class="date-unknown">Date to confirm</span><span class="undated-flag">needs a date</span>`;
    const locHTML = m.location ? `<span class="loc">${esc(m.location)}</span>` : '';
    return `
    <article class="moment" data-group="${groupIndex}" style="--accent:${color}; animation-delay:${Math.min(i*0.06,0.6)}s">
      <div class="moment-head">
        ${dateHTML}${locHTML}
        <span class="count">${flat.length} photo${flat.length!==1?'s':''}</span>
      </div>
      <div class="${wrapClass}" data-group="${groupIndex}">
        <div class="carousel-track ${trackClass.includes('auto')?'auto':''}" style="--dur:${dur}">${trackHTML}</div>
      </div>
    </article>`;
  }

  function openCategory(h){
    allGroups = [];
    const list = DATA.byHeading[h] || [];
    const dated = list.filter(m => m.date);
    const years = dated.length ? `${dated[0].date.year}–${dated[dated.length-1].date.year}` : '';
    document.getElementById('catTitle').textContent = DATA.tabLabels[h];
    document.getElementById('catRange').textContent = `${years ? years + ' · ' : ''}${list.length} moment${list.length!==1?'s':''}`;
    document.getElementById('catSpine').innerHTML = list.map((m,i) => momentHTML(m, COLORS[h], i)).join('') || '<p style="color:var(--muted)">No photos yet.</p>';
    renderNavStrip(h);
    document.getElementById('homeView').style.display = 'none';
    document.getElementById('categoryView').classList.add('active');
    document.querySelectorAll('.carousel-wrap').forEach(w => {
      w.addEventListener('touchstart', () => w.classList.add('touching'), {passive:true});
      w.addEventListener('touchend', () => setTimeout(()=>w.classList.remove('touching'), 600), {passive:true});
    });
    window.scrollTo({top:0, behavior:'smooth'});
  }

  // ---- lightbox ----
  const lb = document.getElementById('lightbox');
  const lbWrap = document.getElementById('lbMediaWrap');
  const lbMeta = document.getElementById('lbMeta');
  let curGroup = null, curIdx = 0;
  function openLB(gi, ti){ curGroup = allGroups[gi]; curIdx = ti; renderLB(); lb.classList.add('open'); }
  function renderLB(){
    const entry = curGroup.flat[curIdx]; const m = entry.m, im = entry.images[0];
    const src = mediaSrc(im.folder || m.folder, im.file);
    lbWrap.innerHTML = im.type === 'video' ? `<video src="${src}" controls autoplay></video>` : `<img src="${src}" alt="">`;
    lbMeta.textContent = `${m.heading}${m.location ? ' — ' + m.location : ''} · ${m.dateLabel || 'date unknown'} · ${curIdx+1}/${curGroup.flat.length}`;
  }
  document.addEventListener('click', (e) => {
    const tile = e.target.closest('.tile');
    if (tile){
      const wrap = tile.closest('.carousel-wrap');
      const gi = parseInt(wrap.dataset.group, 10);
      let ti = parseInt(tile.dataset.idx, 10);
      const len = allGroups[gi].flat.length;
      if (ti >= len) ti = ti % len;
      openLB(gi, ti);
    }
  });
  document.getElementById('lbClose').addEventListener('click', () => lb.classList.remove('open'));
  lb.addEventListener('click', (e) => { if (e.target === lb) lb.classList.remove('open'); });
  document.getElementById('lbPrev').addEventListener('click', (e) => { e.stopPropagation(); curIdx = (curIdx - 1 + curGroup.flat.length) % curGroup.flat.length; renderLB(); });
  document.getElementById('lbNext').addEventListener('click', (e) => { e.stopPropagation(); curIdx = (curIdx + 1) % curGroup.flat.length; renderLB(); });
  window.addEventListener('keydown', (e) => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') lb.classList.remove('open');
    if (e.key === 'ArrowLeft') document.getElementById('lbPrev').click();
    if (e.key === 'ArrowRight') document.getElementById('lbNext').click();
  });
})();
</script>
