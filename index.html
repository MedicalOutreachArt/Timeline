<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Medical Outreach PJ — Our Journey</title>
<meta name="description" content="A scrolling visual timeline of Medical Outreach PJ's outreach programmes.">
<style>
:root{
  --ink:#0f1410; --paper:#faf7f1; --panel:#161b17; --gold:#c6a15b; --gold-soft:#e4cfa0;
  --sage:#4f6a56; --line:rgba(198,161,91,.25); --muted:#9aa39c; --sold-red:#8c2f2f;
  --card-radius:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Helvetica Neue',Arial,sans-serif; overflow-x:hidden;
}
h1,h2,.badge{font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif}
img,video{max-width:100%; display:block}

/* ---------- scroll progress rail ---------- */
#progress-rail{
  position:fixed; left:0; top:0; width:4px; height:100%; background:rgba(0,0,0,.06); z-index:60;
}
#progress-fill{
  width:100%; height:0%; background:linear-gradient(var(--gold), var(--sage)); transition:height .05s linear;
}

/* ---------- hero ---------- */
header.hero{
  background:var(--panel); color:var(--paper); padding:64px 24px 44px; text-align:center;
  border-bottom:4px solid var(--gold); position:relative;
}
header.hero img.logo{width:76px; height:76px; border-radius:50%; margin-bottom:18px; box-shadow:0 0 0 4px rgba(198,161,91,.25)}
header.hero h1{font-size:clamp(2rem,6vw,2.6rem); margin:0 0 8px; letter-spacing:.02em}
header.hero p.sub{color:var(--gold-soft); font-size:1.02rem; margin:0 0 26px}
.stats{display:flex; gap:clamp(16px,5vw,32px); justify-content:center; flex-wrap:wrap}
.stats div{text-align:center}
.stats .num{font-size:1.5rem; font-weight:700; color:var(--gold); display:block; font-family:'Iowan Old Style',Georgia,serif}
.stats .lbl{font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}

.legend{
  display:flex; flex-wrap:wrap; gap:10px 18px; justify-content:center; padding:16px 20px;
  background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:40;
}
.legend-item{font-size:.76rem; display:flex; align-items:center; gap:6px; color:#444; cursor:default}
.swatch{width:10px; height:10px; border-radius:3px; display:inline-block}

main{max-width:1040px; margin:0 auto; padding:40px 16px 100px; position:relative}

.year-block{display:flex; gap:20px; margin-bottom:6px}
.year-marker{
  flex:0 0 72px; position:sticky; top:64px; align-self:flex-start; text-align:right; padding-top:4px; height:fit-content;
}
.year-marker span{
  font-family:'Iowan Old Style',Georgia,serif; font-size:1.7rem; color:var(--gold); font-weight:700;
  border-right:3px solid var(--gold); padding-right:12px; display:inline-block;
}
.year-moments{
  flex:1; min-width:0; border-left:2px solid var(--line); padding-left:22px;
  display:flex; flex-direction:column; gap:26px; position:relative;
}

/* ---------- moment card + scroll reveal ---------- */
article.moment{
  position:relative;
  background:#fff; border-radius:var(--card-radius); border:1px solid #eee2cc;
  border-left:6px solid var(--accent); padding:16px 16px 14px; box-shadow:0 1px 3px rgba(0,0,0,.05);
  opacity:0; transform:translateY(28px) scale(.96);
  transition:opacity .7s cubic-bezier(.2,.7,.3,1), transform .7s cubic-bezier(.2,.7,.3,1);
}
article.moment::before{
  content:''; position:absolute; left:-29px; top:20px; width:12px; height:12px; border-radius:50%;
  background:var(--accent); border:3px solid var(--paper); box-shadow:0 0 0 2px var(--accent);
  transform:scale(0); transition:transform .5s cubic-bezier(.3,1.4,.5,1) .15s;
}
article.moment.in-view{opacity:1; transform:translateY(0) scale(1)}
article.moment.in-view::before{transform:scale(1)}

.moment-head{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:12px}
.badge{color:#fff; font-size:.7rem; padding:4px 10px; border-radius:20px; letter-spacing:.03em}
.date{font-weight:600; font-size:.88rem}
.date-unknown{font-weight:600; font-size:.82rem; color:var(--sold-red); font-style:italic}
.loc{color:#555; font-size:.83rem}
.loc::before{content:"— "; color:#bbb}
.count{margin-left:auto; font-size:.72rem; color:var(--muted)}

/* ---------- carousel ---------- */
.carousel-wrap{position:relative; overflow:hidden; border-radius:10px}
.carousel-wrap::before, .carousel-wrap::after{
  content:''; position:absolute; top:0; bottom:0; width:26px; z-index:2; pointer-events:none;
}
.carousel-wrap::before{left:0; background:linear-gradient(90deg, #fff, transparent)}
.carousel-wrap::after{right:0; background:linear-gradient(270deg, #fff, transparent)}
.carousel-track{
  display:flex; gap:8px; will-change:transform;
}
.carousel-track.auto{ animation:scrollpast linear infinite; animation-duration:var(--dur, 30s); }
.carousel-wrap:hover .carousel-track.auto,
.carousel-wrap.touching .carousel-track.auto{ animation-play-state:paused }
@keyframes scrollpast{ from{transform:translateX(0)} to{transform:translateX(-50%)} }

.carousel-wrap.manual{ overflow-x:auto; -webkit-overflow-scrolling:touch; scroll-snap-type:x proximity }
.carousel-wrap.manual .carousel-track{ animation:none !important }
.carousel-wrap.manual .tile{ scroll-snap-align:start }

.tile{
  flex:0 0 auto; width:150px; height:150px; border-radius:9px; overflow:hidden; position:relative;
  background:#f0ede4; cursor:pointer;
}
.tile img, .tile video{width:100%; height:100%; object-fit:cover}
.tile.pair{width:150px; display:flex; flex-direction:column; gap:2px}
.tile.pair img, .tile.pair video{height:74px; object-fit:cover}
.tile.video .play-badge{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:1.3rem; background:rgba(0,0,0,.28);
}
.tile figcaption{
  position:absolute; left:0; right:0; bottom:0; background:linear-gradient(transparent,rgba(0,0,0,.65));
  color:#fff; font-size:.62rem; padding:12px 6px 5px; line-height:1.2;
}

.caption-slot{margin-top:10px; font-size:.76rem; color:var(--muted); border-top:1px dashed var(--line); padding-top:8px}
.caption-slot em{color:#c7bfa5}

section.undated-section{margin-top:54px}
section.undated-section h2{font-size:1.2rem; color:var(--sold-red); border-bottom:2px solid #f1d9d9; padding-bottom:8px}
section.undated-section .year-moments{border-left:2px dashed #e8b9b9}

/* ---------- lightbox ---------- */
#lightbox{
  position:fixed; inset:0; background:rgba(10,12,10,.94); z-index:100; display:none;
  align-items:center; justify-content:center; flex-direction:column; padding:24px;
}
#lightbox.open{display:flex}
#lightbox img, #lightbox video{max-height:78vh; max-width:92vw; border-radius:8px; box-shadow:0 10px 40px rgba(0,0,0,.5)}
#lightbox .lb-meta{color:var(--gold-soft); font-size:.8rem; margin-top:14px; text-align:center}
#lightbox .lb-close{position:absolute; top:18px; right:22px; color:#fff; font-size:1.8rem; background:none; border:none; cursor:pointer; line-height:1}
#lightbox .lb-nav{position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.08); border:none; color:#fff; font-size:1.6rem; padding:10px 14px; cursor:pointer; border-radius:8px}
#lightbox .lb-prev{left:14px} #lightbox .lb-next{right:14px}

footer{text-align:center; padding:26px; font-size:.72rem; color:var(--muted); background:var(--panel)}

/* ---------- mobile ---------- */
@media (max-width:640px){
  .year-marker{flex-basis:44px; top:52px}
  .year-marker span{font-size:1.25rem; padding-right:8px}
  .year-moments{padding-left:16px; gap:20px}
  article.moment{padding:13px 12px 12px}
  article.moment::before{left:-23px; width:10px; height:10px}
  .tile{width:112px; height:112px}
  .tile.pair{width:112px}
  .tile.pair img,.tile.pair video{height:55px}
  .legend{gap:8px 12px; padding:10px 14px}
  .legend-item{font-size:.68rem}
  main{padding:26px 10px 80px}
}
</style>
</head>
<body>
<div id="progress-rail"><div id="progress-fill"></div></div>

<header class="hero">

<script>
(function(){
  const DATA = JSON.parse(document.getElementById('timeline-data').textContent);
  const COLORS = DATA.headingColors;
  const isTouch = !window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function encPath(p){ return p.split('/').map(encodeURIComponent).join('/'); }
  function mediaSrc(folder, file){ return 'Video/' + encPath(folder) + '/' + encodeURIComponent(file); }

  // ---- build tiles (grouping collage pairs) ----
  function buildTiles(m){
    const imgs = m.images.slice().sort((a,b)=>a.order-b.order);
    const tiles = [];
    const seen = new Set();
    imgs.forEach(im => {
      if (seen.has(im.file)) return;
      if (im.collageGroup){
        const partner = imgs.find(x => x.collageGroup === im.collageGroup && x.file !== im.file);
        if (partner && !seen.has(partner.file)){
          tiles.push({type:'pair', items:[im, partner]});
          seen.add(im.file); seen.add(partner.file);
          return;
        }
      }
      tiles.push({type:'single', items:[im]});
      seen.add(im.file);
    });
    return tiles;
  }

  function tileHTML(tile, m, flatList){
    const idx = flatList.length;
    if (tile.type === 'pair'){
      const inner = tile.items.map(im => mediaTag(im, m)).join('');
      flatList.push({m, images:tile.items});
      return `<div class="tile pair" data-idx="${idx}">${inner}</div>`;
    }
    const im = tile.items[0];
    flatList.push({m, images:[im]});
    const isVideo = im.type === 'video';
    const cap = im.caption ? `<figcaption>${esc(im.caption)}</figcaption>` : '';
    if (isVideo){
      return `<div class="tile video" data-idx="${idx}">
        <video src="${mediaSrc(m.folder, im.file)}" muted preload="metadata"></video>
        <span class="play-badge">&#9658;</span>${cap}
      </div>`;
    }
    return `<div class="tile" data-idx="${idx}"><img src="${mediaSrc(m.folder, im.file)}" loading="lazy" alt="${esc(m.heading)}">${cap}</div>`;
  }
  function mediaTag(im, m){
    if (im.type === 'video'){
      return `<video src="${mediaSrc(m.folder, im.file)}" muted preload="metadata"></video>`;
    }
    return `<img src="${mediaSrc(m.folder, im.file)}" loading="lazy" alt="${esc(m.heading)}">`;
  }

  const allLightboxGroups = []; // one entry per moment: {items:[...], folder}

  function momentHTML(m, undatedMode){
    const color = COLORS[m.heading] || '#8a8a8a';
    const tiles = buildTiles(m);
    const flatList = [];
    const tilesHTML = tiles.map(t => tileHTML(t, m, flatList)).join('');
    const groupIndex = allLightboxGroups.length;
    allLightboxGroups.push({folder:m.folder, flat:flatList});
    const many = flatList.length >= 4;
    const trackHTML = many ? tilesHTML + tilesHTML : tilesHTML; // duplicate for seamless loop
    const dur = Math.max(14, flatList.length * 3.2).toFixed(1) + 's';
    const wrapClass = many && !isTouch ? 'carousel-wrap' : 'carousel-wrap manual';
    const trackClass = many && !isTouch ? 'carousel-track auto' : 'carousel-track';
    const dateHTML = undatedMode
      ? '<span class="date-unknown">Date to confirm</span>'
      : `<span class="date">${esc(m.dateLabel)}</span>`;
    const locHTML = m.location ? `<span class="loc">${esc(m.location)}</span>` : '';
    return `
    <article class="moment" data-group="${groupIndex}" style="--accent:${color}">
      <div class="moment-head">
        <span class="badge" style="background:${color}">${esc(m.heading)}</span>
        ${dateHTML}${locHTML}
        <span class="count">${flatList.length} photo${flatList.length!==1?'s':''}</span>
      </div>
      <div class="${wrapClass}" data-group="${groupIndex}">
        <div class="carousel-track ${trackClass.includes('auto')?'auto':''}" style="--dur:${dur}">${trackHTML}</div>
      </div>
    </article>`;
  }

  // ---- render years ----
  const mainEl = document.getElementById('main');
  let html = '';
  Object.keys(DATA.years).sort((a,b)=>a-b).forEach(y => {
    const cards = DATA.years[y].map(m => momentHTML(m, false)).join('');
    html += `<section class="year-block"><div class="year-marker"><span>${y}</span></div><div class="year-moments">${cards}</div></section>`;
  });
  if (DATA.undated && DATA.undated.length){
    const cards = DATA.undated.map(m => momentHTML(m, true)).join('');
    html += `<section class="undated-section"><h2>Needs a date</h2><div class="year-block"><div class="year-marker"><span>?</span></div><div class="year-moments">${cards}</div></div></section>`;
  }
  mainEl.innerHTML = html;

  // ---- legend ----
  document.getElementById('legend').innerHTML = DATA.headingOrder.map(h =>
    `<span class="legend-item"><span class="swatch" style="background:${COLORS[h]}"></span>${esc(h)}</span>`
  ).join('');

  // ---- scroll reveal ----
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting){ e.target.classList.add('in-view'); io.unobserve(e.target); } });
  }, {threshold:.15, rootMargin:'0px 0px -40px 0px'});
  document.querySelectorAll('article.moment').forEach(el => io.observe(el));

  // ---- scroll progress rail ----
  const fill = document.getElementById('progress-fill');
  let ticking = false;
  function updateProgress(){
    const scrollable = document.documentElement.scrollHeight - window.innerHeight;
    const pct = scrollable > 0 ? Math.min(100, (window.scrollY / scrollable) * 100) : 0;
    fill.style.height = pct + '%';
    ticking = false;
  }
  window.addEventListener('scroll', () => { if(!ticking){ requestAnimationFrame(updateProgress); ticking = true; } }, {passive:true});
  updateProgress();

  // ---- pause carousel on touch ----
  document.querySelectorAll('.carousel-wrap').forEach(w => {
    w.addEventListener('touchstart', () => w.classList.add('touching'), {passive:true});
    w.addEventListener('touchend', () => setTimeout(()=>w.classList.remove('touching'), 600), {passive:true});
  });

  // ---- lightbox ----
  const lb = document.getElementById('lightbox');
  const lbWrap = document.getElementById('lbMediaWrap');
  const lbMeta = document.getElementById('lbMeta');
  let curGroup = null, curIdx = 0;

  function openLB(groupIdx, tileIdx){
    curGroup = allLightboxGroups[groupIdx];
    curIdx = tileIdx;
    renderLB();
    lb.classList.add('open');
  }
  function renderLB(){
    const entry = curGroup.flat[curIdx];
    const m = entry.m, im = entry.images[0];
    const src = mediaSrc(curGroup.folder, im.file);
    lbWrap.innerHTML = im.type === 'video'
      ? `<video src="${src}" controls autoplay></video>`
      : `<img src="${src}" alt="">`;
    lbMeta.textContent = `${m.heading}${m.location ? ' — ' + m.location : ''} · ${m.dateLabel || 'date unknown'} · ${curIdx+1}/${curGroup.flat.length}`;
  }
  document.addEventListener('click', (e) => {
    const tile = e.target.closest('.tile');
    if (tile){
      const wrap = tile.closest('.carousel-wrap');
      const groupIdx = parseInt(wrap.dataset.group, 10);
      let tileIdx = parseInt(tile.dataset.idx, 10);
      const groupLen = allLightboxGroups[groupIdx].flat.length;
      if (tileIdx >= groupLen) tileIdx = tileIdx % groupLen; // duplicated loop copy
      openLB(groupIdx, tileIdx);
    }
  });
  document.getElementById('lbClose').addEventListener('click', () => lb.classList.remove('open'));
  lb.addEventListener('click', (e) => { if (e.target === lb) lb.classList.remove('open'); });
  document.getElementById('lbPrev').addEventListener('click', (e) => { e.stopPropagation(); curIdx = (curIdx - 1 + curGroup.flat.length) % curGroup.flat.length; renderLB(); });
  document.getElementById('lbNext').addEventListener('click', (e) => { e.stopPropagation(); curIdx = (curIdx + 1) % curGroup.flat.length; renderLB(); });
  window.addEventListener('keydown', (e) => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') lb.classList.remove('open');
    if (e.key === 'ArrowLeft') document.getElementById('lbPrev').click();
    if (e.key === 'ArrowRight') document.getElementById('lbNext').click();
  });
})();
</script>
